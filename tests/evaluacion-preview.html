<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista previa — Evaluación Fase 2</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<style>
  body { background:#eef1f5; padding: 20px 12px 60px; }
  .seg { display:inline-flex; background:#e9edf2; border-radius:10px; padding:4px; gap:4px; }
  .seg button { border:0; background:transparent; padding:.35rem .8rem; border-radius:8px; font-weight:600; font-size:.85rem; color:#46566b; }
  .seg button.active { background:var(--primary); color:#fff; }
  .preview-wrap { max-width: 680px; margin: 0 auto; }
  .preview-head { display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .preview-head h1 { font-size:1.05rem; font-weight:800; color:var(--primary); margin:0; }
  .modal-content { border:0; box-shadow:0 10px 40px rgba(0,0,0,.15); }
  .live-slider { accent-color: var(--primary); }
</style>
</head>
<body>
<div class="preview-wrap">
  <div class="preview-head">
    <h1>Vista previa — Evaluación de Presentación (Fase 2)</h1>
    <div class="d-flex gap-2 flex-wrap">
      <div class="seg" id="segMod">
        <button data-mod="cartel" class="active">Cartel</button>
        <button data-mod="ponencia">Ponencia</button>
      </div>
      <div class="seg" id="segRo">
        <button data-ro="0" class="active">Editable</button>
        <button data-ro="1">Como enviada</button>
      </div>
    </div>
  </div>

  <div class="modal-content">
    <div class="modal-header bg-unam text-white">
      <h5 class="modal-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-1"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        Evaluación de Presentación
      </h5>
    </div>
    <div class="modal-body">
      <h5 id="liveWorkTitle" class="mb-3 text-primary-theme"></h5>

      <div id="liveReadOnlyBanner" class="alert alert-success d-none text-center fw-bold mb-3">
        ✅ Evaluación enviada — solo vista previa
      </div>

      <div class="alert alert-warning border-start border-4 border-warning mb-3">
        <div class="d-flex align-items-center gap-3 flex-wrap">
          <strong class="fs-6">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-1"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            ¿Se presentó el trabajo?
          </strong>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="sePresento" id="sePresentoSi" value="si">
            <label class="form-check-label fw-bold text-success" for="sePresentoSi">Sí</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="sePresento" id="sePresentoNo" value="no">
            <label class="form-check-label fw-bold text-danger" for="sePresentoNo">No</label>
          </div>
        </div>
      </div>

      <div id="liveEvaluationContainer">
        <form id="liveForm">
          <div id="liveRubricContainer"></div>

          <div class="alert alert-secondary text-center">
            Total: <span id="liveTotal" class="fw-bold fs-5">0</span> / 100
          </div>

          <div class="mb-3">
            <label class="form-label">Comentarios adicionales</label>
            <textarea class="form-control" id="liveComments" rows="3"
              placeholder="Observaciones sobre la presentación en vivo..."></textarea>
          </div>
        </form>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary">Cancelar</button>
      <button type="button" class="btn btn-success fw-bold" id="btnSubmit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-1"><polyline points="20 6 9 17 4 12"/></svg>
        Enviar Calificación
      </button>
    </div>
  </div>

  <p class="text-muted small mt-3 mb-0">
    Reproduce el modal real de <code>evaluator-dashboard.html</code>. La rúbrica tiene un control por sección; cada sección vale su peso ×10 (total 100).
  </p>
</div>

<script>
const LIVE_RUBRICAS = {
  cartel: {
    label: 'Cartel',
    secciones: [
      { id: 'cartel_estructura', nombre: 'Estructura del cartel', max: 10, items: [['Cintillo', 1], ['Facultad a la que pertenece', 1], ['Título del proyecto', 1], ['Integrantes', 1], ['Introducción o Resumen', 1], ['Objetivos', 1], ['Metodología', 1], ['Resultados', 1], ['Conclusión', 1], ['Referencias Bibliográficas', 1]] },
      { id: 'cartel_diseno', nombre: 'Diseño de cartel', max: 20, items: [['Es original y creativo', 5], ['No hay saturación de texto', 5], ['Usa combinación de colores con contraste adecuado', 5], ['Emplean imágenes alusivas al tema', 5]] },
      { id: 'cartel_escrita', nombre: 'Comunicación escrita', max: 5, items: [['La redacción es clara y precisa', 2], ['Utiliza nomenclatura, símbolos y terminología precisa de la disciplina', 2], ['Sin errores de ortografía', 1]] },
      { id: 'cartel_expresion', nombre: 'Expresión oral', max: 10, items: [['Las y los ponentes cuentan con expresión oral clara', 2], ['Volumen adecuado de voz', 2], ['Sin muletillas ni lectura textual', 2], ['La comunicación fluye con naturalidad', 2], ['Atrae y mantiene al público atento', 2]] },
      { id: 'cartel_lenguaje', nombre: 'Lenguaje corporal', max: 5, items: [['Postura profesional', 1], ['Vestimenta formal para el evento', 1], ['Demuestran seguridad', 1], ['Buen manejo del escenario', 1], ['Contacto visual con la audiencia', 1]] },
      { id: 'cartel_equipo', nombre: 'Trabajo en equipo', max: 10, items: [['Mantienen el control del tiempo de la presentación', 3], ['La transición es fluida entre ponentes', 3], ['La participación es equitativa entre los integrantes del equipo', 4]] },
      { id: 'cartel_dominio', nombre: 'Dominio del contenido', max: 20, items: [['Demuestran dominio del tema al exponer', 10], ['Evitan limitarse a leer lo que está escrito en el cartel', 5], ['Interpretan correctamente datos y/o gráficas', 5]] },
      { id: 'cartel_defensa', nombre: 'Defensa de preguntas', max: 15, items: [['Responden con precisión, seguridad y sustento técnico al evaluador', 15]] },
      { id: 'cartel_innovacion', nombre: 'Innovación u optimización', max: 5, items: [['Destacan las relevancias del estudio, aplicabilidad industrial o propuesta de mejora', 5]] }
    ]
  },
  ponencia: {
    label: 'Ponencia',
    secciones: [
      { id: 'pon_estructura', nombre: 'Estructura de la ponencia', max: 10, items: [['Respeta el formato de la carátula del encuentro (tipo proyecto, facultad, nombre del proyecto, integrantes y asesor)', 3], ['Las diapositivas posteriores contienen cintillo representativo del evento', 3], ['Incluye índice, introducción o resumen, objetivos, metodología, resultados, conclusión y referencias', 4]] },
      { id: 'pon_diseno', nombre: 'Diseño de la presentación', max: 20, items: [['Es original y creativo', 5], ['No hay saturación de texto', 5], ['Usa combinación de colores con contraste adecuado', 5], ['Emplean imágenes alusivas al tema', 5]] },
      { id: 'pon_apoyo', nombre: 'Apoyo visual', max: 10, items: [['Uso adecuado de diagramas de flujo, estadísticas y/o tablas, ecuaciones en formato legible y pie de imagen-texto', 10]] },
      { id: 'pon_expresion', nombre: 'Expresión oral', max: 5, items: [['Expresión oral clara y volumen adecuado, sin muletillas ni lectura textual; la comunicación fluye, atrae y mantiene al público atento, y transmite seguridad', 5]] },
      { id: 'pon_lenguaje', nombre: 'Lenguaje corporal', max: 5, items: [['Postura profesional', 1], ['Vestimenta formal para el evento', 1], ['Demuestran seguridad', 1], ['Buen manejo del escenario', 1], ['Contacto visual con la audiencia', 1]] },
      { id: 'pon_equipo', nombre: 'Trabajo en equipo', max: 5, items: [['Se ajustan estrictamente al tiempo asignado (15 min)', 1], ['La transición es fluida entre ponentes', 2], ['La participación es equitativa entre los integrantes del equipo', 2]] },
      { id: 'pon_dominio', nombre: 'Dominio del contenido', max: 30, items: [['Evitan limitarse a leer lo que está escrito en la presentación', 5], ['Interpretan correctamente datos y/o gráficas', 15], ['Demuestran conocimientos de la literatura especializada comparando sus resultados con lo reportado por otros autores', 10]] },
      { id: 'pon_defensa', nombre: 'Defensa de preguntas', max: 10, items: [['Responden con precisión, seguridad y sustento técnico al evaluador', 10]] },
      { id: 'pon_innovacion', nombre: 'Innovación u optimización', max: 5, items: [['Destacan las relevancias del estudio, aplicabilidad industrial o propuesta de mejora', 5]] }
    ]
  }
};

const TITULOS = {
  cartel: 'CARTEL-01 — "Evaluación de biosorbentes"',
  ponencia: 'IQ-042 — "Evaluación de biosorbentes"'
};

let modality = 'cartel';
let readOnly = false;

function renderLiveRubric(mod) {
  const rub = LIVE_RUBRICAS[mod] || LIVE_RUBRICAS.ponencia;
  const cont = document.getElementById('liveRubricContainer');
  cont.innerHTML = rub.secciones.map(sec => `
    <div class="mb-3 p-3 border rounded bg-light">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <label class="fw-bold mb-0">${sec.nombre}</label>
        <span class="badge bg-primary fs-6 rubric-val" id="val_${sec.id}">0</span>
      </div>
      <small class="text-muted d-block mb-2">${sec.items.map(i => '• ' + i[0] + ' (' + i[1] + ' pt' + (i[1] === 1 ? '' : 's') + ')').join('<br>')}</small>
      <input type="range" class="form-range live-slider" id="r_${sec.id}" data-sec="${sec.id}" min="0" max="${sec.max}" step="1" value="0" oninput="updLive()">
      <div class="d-flex justify-content-between small text-muted"><span>0</span><span>${sec.max}</span></div>
    </div>
  `).join('');
}

function updLive() {
  let sum = 0;
  document.querySelectorAll('#liveForm .live-slider').forEach(r => {
    sum += parseInt(r.value || 0);
    const display = document.getElementById('val_' + r.dataset.sec);
    if (display) display.innerText = r.value;
  });
  document.getElementById('liveTotal').innerText = sum;
}

function render() {
  document.getElementById('liveWorkTitle').innerText = TITULOS[modality];
  renderLiveRubric(modality);

  const banner = document.getElementById('liveReadOnlyBanner');
  const btnSubmit = document.getElementById('btnSubmit');
  const comments = document.getElementById('liveComments');

  if (readOnly) {
    banner.classList.remove('d-none');
    document.getElementById('sePresentoSi').checked = true;
    comments.value = 'Excelente presentación; se recomienda cuidar el tiempo en la sección de resultados.';
    comments.readOnly = true;
    document.querySelectorAll('#liveForm .live-slider').forEach(s => {
      const val = Math.round(parseInt(s.max) * 0.85);
      s.value = val;
      s.disabled = true;
      const d = document.getElementById('val_' + s.dataset.sec);
      if (d) d.innerText = val;
    });
    btnSubmit.style.display = 'none';
  } else {
    banner.classList.add('d-none');
    document.getElementById('sePresentoSi').checked = false;
    document.getElementById('sePresentoNo').checked = false;
    comments.value = '';
    comments.readOnly = false;
    document.querySelectorAll('#liveForm .live-slider').forEach(s => { s.disabled = false; });
    btnSubmit.style.display = '';
  }
  updLive();
}

document.getElementById('segMod').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  modality = b.dataset.mod;
  document.querySelectorAll('#segMod button').forEach(x => x.classList.toggle('active', x === b));
  render();
});
document.getElementById('segRo').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  readOnly = b.dataset.ro === '1';
  document.querySelectorAll('#segRo button').forEach(x => x.classList.toggle('active', x === b));
  render();
});

render();
</script>
</body>
</html>
